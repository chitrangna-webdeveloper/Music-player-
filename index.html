
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Music | Chitrangna</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="music-player">

        <!-- Header -->
        <div class="player-header">
            <span>MY MUSIC</span>
            <span class="dot"></span>
        </div>


        <!-- Song Cover -->
        <div class="cover-container">
            <img
                id="cover"
                src="assests/1623410-i-5fe8c00b81e1.jpeg"
                alt="Song Cover"
            >
        </div>


        <!-- Song Information -->
        <div class="song-info">

            <h2 id="song-name">
                Main Rahoon Ya Na Rahoon
            </h2>

            <p id="artist-name">
                Armaan Malik
            </p>

        </div>


        <!-- Progress Bar -->
        <div class="progress-section">

            <span id="current-time">0:00</span>

            <input
                type="range"
                id="progress"
                value="0"
                min="0"
                max="100"
            >

            <span id="duration">0:00</span>

        </div>


        <!-- Player Controls -->
        <div class="controls">

            <button id="prev" aria-label="Previous Song">
                ⏮
            </button>

            <button
                id="play"
                class="play-btn"
                aria-label="Play or Pause"
            >
                ▶
            </button>

            <button id="next" aria-label="Next Song">
                ⏭
            </button>

        </div>


        <!-- Volume -->
        <div class="volume-section">

            <span>🔊</span>

            <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="1"
            >

        </div>


        <!-- Playlist -->
        <div class="playlist">

            <h3>Playlist</h3>


            <!-- Song 1 -->
            <div
                class="playlist-item active"
                data-index="0"
            >

                <div>
                    <strong>
                        Main Rahoon Ya Na Rahoon
                    </strong>

                    <small>
                        Armaan Malik
                    </small>
                </div>

                <span>01</span>

            </div>


            <!-- Song 2 -->
            <div
                class="playlist-item"
                data-index="1"
            >

                <div>
                    <strong>
                        Jeena Jeena
                    </strong>

                    <small>
                        Atif Aslam
                    </small>
                </div>

                <span>02</span>

            </div>


            <!-- Song 3 -->
            <div
                class="playlist-item"
                data-index="2"
            >

                <div>
                    <strong>
                        Tere Sang Yaara
                    </strong>

                    <small>
                        Atif Aslam
                    </small>
                </div>

                <span>03</span>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
